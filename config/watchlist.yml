# Configuracion de busqueda. Todo lo que cambies aqui afecta al proximo cron.

# Cuantos viajais. El precio del vuelo es por persona y el del alojamiento para
# todo el grupo: hace falta saberlo para calcular el coste real de la escapada.
party_size: 2

notify:
  # resend | smtp | github_issue  (ver docs/ARCHITECTURE.md)
  method: resend
  to: mateogonsilva@gmail.com
  # Aviso inmediato solo si es un chollo excepcional (evita el correo diario)
  min_score: 88
  # Ademas, resumen semanal aunque no haya nada excepcional. 6 = domingo
  digest_weekday: 6
  digest_min_score: 70
  # Si una oferta ya avisada baja este % adicional, se vuelve a avisar
  renotify_drop_pct: 15
  # Maximo de ofertas por email
  max_offers_per_email: 6

providers:
  - ryanair          # sin API key
  - google_flights   # sin API key: contrasta el resto de aerolineas
  - amadeus          # se desactiva solo si no hay AMADEUS_CLIENT_ID/SECRET

stays:
  providers:
    - airbnb
    - amadeus_hotels
    - deeplinks      # Booking / Kayak / Google Hotels, sin scraping
  adults: 2

search:
  # Cuantos dias hacia delante mirar. Los chollos de verdad estan a 4-8 meses:
  # de aqui a un mes ya solo quedan las tarifas caras.
  days_ahead: 300
  # Filosofia: escapada, no vacaciones. Fuera de agosto no renta irse 8 dias.
  nights_min: 2
  nights_max: 4
  currency: EUR
  market: es-es
  # Escapada de finde: salir viernes por la tarde, volver domingo por la tarde.
  # mode: prefer  -> las prioriza (bonus al score) pero deja ver el resto
  # mode: only    -> descarta todo lo que no cuadre
  # mode: off     -> ignora el dia de la semana
  weekend:
    mode: prefer
    outbound_weekday: 4   # 0=lunes, 4=viernes
    outbound_after: "15:00"
    outbound_before: "22:00"
    inbound_weekday: 6    # domingo
    inbound_after: "15:00"
    inbound_before: "23:59"
    bonus: 15
    # Cuantos fines de semana barrer (uno por consulta)
    max_weeks: 26

  google:
    # Cada consulta descarga ~2,5 MB de la pagina de Google: pocas y espaciadas.
    max_queries: 18
    min_interval_seconds: 4

  # Pasajeros del vuelo (el precio mostrado es el total de ida y vuelta para todos)
  adults: 1
  # Segundos minimos entre peticiones a un mismo proveedor
  min_interval_seconds: 2

# Nombre de ciudad por aeropuerto. Lo usa Google Flights (que solo devuelve IATA)
# y, sobre todo, la busqueda de alojamiento: buscar "MXP" en Airbnb no da nada.
city_names:
  FCO: [Roma, Italia]
  NAP: [Napoles, Italia]
  MXP: [Milan, Italia]
  BGY: [Bergamo, Italia]
  BLQ: [Bolonia, Italia]
  LIS: [Lisboa, Portugal]
  OPO: [Oporto, Portugal]
  CDG: [Paris, Francia]
  BVA: [Paris, Francia]
  BRU: [Bruselas, Belgica]
  CRL: [Bruselas, Belgica]
  DUB: [Dublin, Irlanda]
  EDI: [Edimburgo, Reino Unido]
  BER: [Berlin, Alemania]

routes:
  - origin: MAD
    origin_name: Madrid
    # "any" = cualquier destino que ofrezca el proveedor
    destinations: any
    max_price: 60
    # Tope propio para la escapada de viernes tarde (esos vuelos valen mas)
    max_price_weekend: 130
    # Precio de referencia mientras no haya historico suficiente
    baseline_price: 110
    baseline_price_weekend: 200

  - origin: MAD
    origin_name: Madrid
    destinations: [FCO, NAP, MXP, LIS, OPO, CDG, BRU, DUB, EDI, BER]
    max_price: 45
    max_price_weekend: 120
    baseline_price: 95
    baseline_price_weekend: 190
