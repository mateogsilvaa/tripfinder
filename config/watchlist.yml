routes:
  - origin: MAD
    origin_name: Madrid
    # "any" = cualquier destino que ofrezca el proveedor
    destinations: any
    max_price: 60
    # Tope propio para la escapada de viernes tarde (esos vuelos valen mas)
    max_price_weekend: 130
    # Precio de referencia mientras no haya historico suficiente
    baseline_price: 110
    baseline_price_weekend: 200

  - origin: MAD
    origin_name: Madrid
    destinations: [FCO, NAP, MXP, LIS, OPO, CDG, BRU, DUB, EDI, BER]
    max_price: 45
    max_price_weekend: 120
    baseline_price: 95
    baseline_price_weekend: 190

  # Destinos donde Ryanair no vuela desde Madrid o no es competitivo: aqui la
  # oferta la pone Iberia, Vueling, Air Europa, ITA, Lufthansa o KLM. Los topes
  # son mas altos porque estas rutas nunca van a valer 30 EUR.
  - origin: MAD
    origin_name: Madrid
    destinations: [AMS, MUC, FRA, ZRH, VIE, CPH, PRG, BUD, WAW, ATH, VCE, FLR, PMO, CTA,
                   OTP, SOF, PSA, TIA, KRK, SKG, LCA, RAK, FNC]
    max_price: 130
    max_price_weekend: 220
    baseline_price: 230
    baseline_price_weekend: 330
