<aside id="panel" class="panel" hidden aria-label="Alojamiento">
  <header class="panel-head">
    <div>
      <p class="kicker">Alojamiento</p>
      <h2 id="panelTitle"></h2>
      <p id="panelDates" class="panel-dates"></p>
    </div>
    <button id="panelClose" type="button" aria-label="Cerrar el panel de alojamiento">cerrar</button>
  </header>
  <div id="panelBody" class="panel-body"></div>
</aside>
<div id="backdrop" class="backdrop" hidden></div>

<div id="pedirCuenta" class="modal" hidden>
  <div class="modal-caja pedir-caja" role="dialog" aria-label="Pedir una cuenta">
    <header class="modal-head">
      <div>
        <p class="kicker">sin cuenta</p>
        <h2>Pedir una cuenta</h2>
      </div>
      <button id="pedirClose" type="button" aria-label="Cerrar">cerrar</button>
    </header>
    <div id="pedirBody" class="pedir-body"></div>
  </div>
</div>

<div id="destModal" class="modal" hidden>
  <div class="modal-caja" role="dialog" aria-label="Elegir destino">
    <header class="modal-head">
      <h2>¿A dónde?</h2>
      <button id="destClose" type="button" aria-label="Cerrar">cerrar</button>
    </header>
    <input id="destSearch" type="search" placeholder="Escribe una ciudad o un país…" autocomplete="off">
    <div id="destList" class="dest-list"></div>
  </div>
</div>

<div id="hojaCompartir" class="modal" hidden>
  <div class="modal-caja hoja-compartir" role="dialog" aria-labelledby="hojaCompartirTit">
    <header class="hoja-cabeza" id="hojaFicha">
      <div class="hoja-foto" id="hojaFoto"></div>
      <div class="hoja-titulo">
        <div class="hoja-titulo-txt">
          <span class="hoja-kicker">Compartir</span>
          <h2 id="hojaCompartirTit">Compartir este viaje</h2>
          <span class="hoja-sub" id="hojaSub"></span>
        </div>
        <div class="hoja-precio"><b id="hojaPrecio"></b><span>por persona</span></div>
      </div>
      <button id="hojaCompartirClose" class="hoja-cerrar" type="button" aria-label="Cerrar"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </header>
    <p class="hoja-datos" id="hojaDatos"></p>

    <div class="hoja-cuerpo">
      <div class="hoja-enlace">
        <span id="hojaURL" class="hoja-url"></span>
        <button id="hojaCopiar" type="button" class="btn primary small">Copiar enlace</button>
      </div>

      <div class="hoja-apps" id="hojaApps"></div>

      <div class="hoja-bloque" id="hojaHop" hidden>
        <span class="hoja-rotulo">Proponerlo en un HOP</span>
        <ul class="hoja-hops" id="hojaHops"></ul>
        <p class="hoja-nota" id="hojaHopMsg" role="status"></p>
      </div>

      <div class="hoja-calendario">
        <div class="hoja-calendario-txt"><b>Al calendario</b><span>Ida y vuelta con la hora del billete (.ics)</span></div>
        <button id="hojaICS" type="button" class="btn ghost small"><span class="hoja-ics-largo">Descargar</span><span class="hoja-ics-corto" aria-hidden="true">→</span></button>
      </div>

      <p class="hoja-nota">Si mañana ya no está barato, quien abra el enlace lo verá dicho.</p>
    </div>
  </div>
</div>
