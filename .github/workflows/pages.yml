name: Desplegar web (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "data/**"
      - "tools/montar.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Copiar ficheros y subirlos. Nada mas.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La cabecera, el nav, las hojas y el pie viven una sola vez en
      # web/partes/. Si alguien edito una region a mano en vez de tocar la
      # parte, mejor parar aqui que publicar cuatro cabeceras distintas.
      - name: Comprobar que las partes estan montadas
        run: python tools/montar.py --check

      # La version de los assets sale de aqui, no de un numero a mano en doce
      # sitios. El hash corto del commit que se publica: cambia cuando cambia
      # el contenido, que es exactamente lo que tiene que romper la cache. Va
      # al `?v=` de los cuatro HTML y al `build` del pie, de una sola pasada,
      # asi que dos paginas no pueden acabar enseñando builds distintos.
      - name: Sellar la version en los HTML
        run: python tools/montar.py --version "$(git rev-parse --short HEAD)"

      - name: Montar el sitio
        run: |
          mkdir -p _site
          cp -r web/* _site/
          rm -rf _site/partes        # las partes son fuente, no pagina
          mkdir -p _site/data
          cp -r data/* _site/data/ 2>/dev/null || true
          touch _site/.nojekyll

      # `data/users.json` lleva el email en claro de cada cuenta, y la copia de
      # arriba lo publicaba tal cual: cualquiera que abriera
      # …github.io/tripfinder/data/users.json leia las direcciones. La web no
      # los necesita —solo saber SI hay uno, para no decirle "no recibes nada"
      # a quien si recibe—, asi que se pisa con la version recortada. El
      # fichero del repo se queda entero: de ahi los saca el cron.
      - name: Publicar las cuentas sin las direcciones de correo
        run: PYTHONPATH=src python -m tripfinder users publish --out _site/data/users.json

      - name: Comprobar que no se publica ningun email
        run: |
          if grep -q "@" _site/data/users.json; then
            echo "Hay una arroba en el users.json que iba a publicarse:"
            grep -n "@" _site/data/users.json
            exit 1
          fi
          echo "Sin direcciones de correo."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
