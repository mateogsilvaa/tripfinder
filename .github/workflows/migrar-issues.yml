name: Pasar las issues a Firebase

# Las issues fueron el sitio donde se apuntaba todo —avisos de chollo, peticiones
# de cuenta, busquedas de alojamiento, la lista de tareas— y el repo es publico.
# Esto las copia a Firestore, donde las reglas las dejan cerradas para el
# navegador. No toca las issues: ni las cierra ni las borra.
#
# Solo a mano. Sin marcar `escribir` es un simulacro: cuenta lo que hay y
# comprueba que la cuenta de servicio entra, sin escribir nada. Se puede repetir
# las veces que haga falta, porque cada issue es un documento con su numero como
# id: volver a pasarlo reescribe lo mismo.
#
# El log de un repo publico lo lee cualquiera, asi que solo saca recuentos.

on:
  workflow_dispatch:
    inputs:
      escribir:
        description: "Escribir en Firestore (si no, simulacro: solo cuenta y comprueba la conexion)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: read

concurrency:
  group: migrar-issues
  cancel-in-progress: false

jobs:
  migrar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Solo lo que usa esto: scrapling y compania no hacen falta.
      - name: Dependencias
        run: pip install requests PyYAML python-dotenv "google-cloud-firestore>=2.19"

      - name: Pasar las issues
        env:
          PYTHONPATH: src
          GITHUB_TOKEN: ${{ github.token }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ESCRIBIR: ${{ inputs.escribir }}
        run: |
          if [ "$ESCRIBIR" = "true" ]; then
            python -m tripfinder migrar-issues --escribir
          else
            python -m tripfinder migrar-issues
          fi
