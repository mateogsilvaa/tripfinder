name: Sondeo hoteles (temporal)
on:
  push:
    branches: [ccr-a58be70c-672avy]
    paths: [sondeo/sondeo.py]
permissions:
  contents: write
jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python sondeo/sondeo.py
      - run: |
          git config user.name tripfinder-bot
          git config user.email actions@github.com
          git add -f sondeo/out
          git commit -m "sondeo: resultados" || exit 0
          git pull --rebase
          git push
