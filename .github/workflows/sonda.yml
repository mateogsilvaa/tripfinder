name: Sonda de alojamiento (temporal)
on:
  push:
    branches: [claude/tripfinder-nuevo-diseno-kbnsrk]
    paths: [".github/sonda.py", ".github/workflows/sonda.yml"]
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python .github/sonda.py
