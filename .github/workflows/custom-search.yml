name: Busqueda personalizada

# Se dispara cuando la web abre una issue "[buscar] <lo que sea>".
# Igual que el alojamiento: la web es estatica, asi que la issue es la cola.

on:
  repository_dispatch:
    types: [search]
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  actions: write # para lanzar el deploy de Pages
  issues: write

concurrency:
  # Un grupo por busqueda: con un grupo comun, al encolar una nueva GitHub
  # cancelaba la anterior que estaba esperando y desaparecia sin decir nada.
  # Los commits no chocan porque cada una escribe su fichero y hay rebase.
  group: busqueda-${{ github.event.client_payload.dest || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  buscar:
    if: >
      github.event_name == 'repository_dispatch' ||
      (github.event.issue.user.login == github.repository_owner &&
       startsWith(github.event.issue.title, '[buscar] '))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Leer los parametros
        id: parse
        env:
          EVENT: ${{ github.event_name }}
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          P_DEST: ${{ github.event.client_payload.dest }}
          P_LABEL: ${{ github.event.client_payload.label }}
          P_MAX: ${{ github.event.client_payload.max_price }}
          P_NIGHTS: ${{ github.event.client_payload.nights }}
          P_MONTHS: ${{ github.event.client_payload.months }}
          P_WEEKEND: ${{ github.event.client_payload.weekend }}
          P_ADULTS: ${{ github.event.client_payload.adults }}
          P_DEPART: ${{ github.event.client_payload.depart }}
          P_RETURN: ${{ github.event.client_payload.return_date }}
        run: |
          # Igual que en el alojamiento: la web manda los datos ya estructurados.
          if [ "$EVENT" = "repository_dispatch" ]; then
            {
              echo "dest=$P_DEST"; echo "label=$P_LABEL"; echo "max_price=$P_MAX"
              echo "nights=$P_NIGHTS"; echo "months=$P_MONTHS"; echo "weekend=$P_WEEKEND"
              echo "adults=$P_ADULTS"; echo "depart=$P_DEPART"; echo "return_date=$P_RETURN"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "label=${TITLE#\[buscar\] }" >> "$GITHUB_OUTPUT"
          for key in dest max_price nights months weekend adults depart return_date; do
            value=$(printf '%s' "$BODY" | grep -m1 "^${key}:" | cut -d' ' -f2- | tr -d '\r')
            echo "${key}=${value}" >> "$GITHUB_OUTPUT"
          done

      - name: Buscar
        env:
          PYTHONPATH: src
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          DEST: ${{ steps.parse.outputs.dest }}
          LABEL: ${{ steps.parse.outputs.label }}
          MAX_PRICE: ${{ steps.parse.outputs.max_price }}
          NIGHTS: ${{ steps.parse.outputs.nights }}
          MONTHS: ${{ steps.parse.outputs.months }}
          WEEKEND: ${{ steps.parse.outputs.weekend }}
          ADULTS: ${{ steps.parse.outputs.adults }}
          DEPART: ${{ steps.parse.outputs.depart }}
          RETURN_DATE: ${{ steps.parse.outputs.return_date }}
        run: |
          args=()
          if [ -n "$MAX_PRICE" ]; then args+=(--max-price "$MAX_PRICE"); fi
          if [ -n "$NIGHTS" ];    then args+=(--nights "$NIGHTS"); fi
          if [ -n "$MONTHS" ];    then args+=(--months "$MONTHS"); fi
          if [ -n "$ADULTS" ];    then args+=(--adults "$ADULTS"); fi
          if [ -n "$DEPART" ];    then args+=(--depart "$DEPART"); fi
          if [ -n "$RETURN_DATE" ]; then args+=(--return "$RETURN_DATE"); fi
          # weekend: "no" busca cualquier dia de la semana
          if [ "$WEEKEND" = "no" ]; then args+=(--any-day); fi
          python -m tripfinder search \
            --dest "$DEST" --label "$LABEL" "${args[@]}" \
            --summary-out summary.md

      - name: Publicar resultados
        run: |
          git config user.name  "tripfinder-bot"
          git config user.email "actions@github.com"
          git add data
          if git diff --staged --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "data: busqueda"
          # Varias busquedas a la vez tocan el indice y el rebase choca. El
          # indice es un derivado, asi que se regenera y se sigue.
          for intento in 1 2 3; do
            if git pull --rebase --autostash; then break; fi
            PYTHONPATH=src python -m tripfinder reindex || true
            git add data
            GIT_EDITOR=true git rebase --continue || git rebase --skip || true
          done
          git push || (git pull --rebase --autostash && git push)

      - name: Redesplegar la web
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

      - name: Contestar en la issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body-file summary.md
          gh issue close ${{ github.event.issue.number }} \
            --comment "Resultados publicados en la web (tarda ~1 min en desplegarse)."

      - name: Avisar si algo fallo
        if: failure() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --body "La busqueda fallo. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
