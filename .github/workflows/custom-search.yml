name: Busqueda personalizada

# La web manda un repository_dispatch directo desde el navegador, con el token
# de la cuenta. Ya no escucha issues: el camino por issue existio cuando no
# habia cuentas, pero cada issue del repositorio —incluidas las de aviso de
# chollo, que se abren solas— arrancaba un run de esto para descartarlo en el
# `if`, y encima por partida doble (`opened` y `labeled`).

on:
  repository_dispatch:
    types: [search]

permissions:
  contents: write
  actions: write # para lanzar el deploy de Pages

concurrency:
  # Un grupo por busqueda: con un grupo comun, al encolar una nueva GitHub
  # cancelaba la anterior que estaba esperando y desaparecia sin decir nada.
  # Los commits no chocan porque cada una escribe su fichero y hay rebase.
  group: busqueda-${{ github.event.client_payload.dest || github.run_id }}
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    # Un barrido "donde sea" son ~8 minutos. Si pasa de 30 es que algo se ha
    # colgado, y sin esto se queda hasta el limite de 6 horas de GitHub.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Leer los parametros
        id: parse
        env:
          P_DEST: ${{ github.event.client_payload.dest }}
          P_ORIGIN: ${{ github.event.client_payload.viaje.origin }}
          P_LABEL: ${{ github.event.client_payload.label }}
          P_MAX: ${{ github.event.client_payload.max_price }}
          P_NIGHTS: ${{ github.event.client_payload.nights }}
          P_MONTHS: ${{ github.event.client_payload.months }}
          P_WEEKEND: ${{ github.event.client_payload.weekend }}
          P_ADULTS: ${{ github.event.client_payload.adults }}
          # El viaje va agrupado —de donde sales y cuando— porque
          # `client_payload` solo admite diez propiedades de primer nivel:
          # sueltas eran doce, y el origen habria sido la trece.
          P_DEPART: ${{ github.event.client_payload.viaje.depart }}
          P_RETURN: ${{ github.event.client_payload.viaje.return_date }}
          P_DESDE: ${{ github.event.client_payload.viaje.desde }}
          P_HASTA: ${{ github.event.client_payload.viaje.hasta }}
          P_CAMAS: ${{ github.event.client_payload.viaje.camas }}
          P_OWNER: ${{ github.event.client_payload.owner }}
          P_OWNER_NAME: ${{ github.event.client_payload.owner_name }}
        run: |
          # La web manda los datos ya estructurados: aqui no se parsea texto.
          {
            echo "dest=$P_DEST"; echo "label=$P_LABEL"; echo "max_price=$P_MAX"
            echo "nights=$P_NIGHTS"; echo "months=$P_MONTHS"; echo "weekend=$P_WEEKEND"
            echo "adults=$P_ADULTS"; echo "depart=$P_DEPART"; echo "return_date=$P_RETURN"
            echo "desde=$P_DESDE"; echo "hasta=$P_HASTA"; echo "origin=$P_ORIGIN"
            echo "camas=$P_CAMAS"
            echo "owner=$P_OWNER"; echo "owner_name=$P_OWNER_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Buscar
        env:
          PYTHONPATH: src
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          DEST: ${{ steps.parse.outputs.dest }}
          ORIGIN: ${{ steps.parse.outputs.origin }}
          LABEL: ${{ steps.parse.outputs.label }}
          MAX_PRICE: ${{ steps.parse.outputs.max_price }}
          NIGHTS: ${{ steps.parse.outputs.nights }}
          MONTHS: ${{ steps.parse.outputs.months }}
          WEEKEND: ${{ steps.parse.outputs.weekend }}
          ADULTS: ${{ steps.parse.outputs.adults }}
          DEPART: ${{ steps.parse.outputs.depart }}
          RETURN_DATE: ${{ steps.parse.outputs.return_date }}
          DESDE: ${{ steps.parse.outputs.desde }}
          HASTA: ${{ steps.parse.outputs.hasta }}
          OWNER: ${{ steps.parse.outputs.owner }}
          OWNER_NAME: ${{ steps.parse.outputs.owner_name }}
        run: |
          args=()
          if [ -n "$MAX_PRICE" ]; then args+=(--max-price "$MAX_PRICE"); fi
          if [ -n "$NIGHTS" ];    then args+=(--nights "$NIGHTS"); fi
          if [ -n "$MONTHS" ];    then args+=(--months "$MONTHS"); fi
          if [ -n "$ADULTS" ];    then args+=(--adults "$ADULTS"); fi
          if [ -n "$DEPART" ];    then args+=(--depart "$DEPART"); fi
          if [ -n "$RETURN_DATE" ]; then args+=(--return "$RETURN_DATE"); fi
          # El tramo en que puedes viajar: "en marzo", "del 3 al 19".
          if [ -n "$DESDE" ];     then args+=(--desde "$DESDE"); fi
          if [ -n "$HASTA" ];     then args+=(--hasta "$HASTA"); fi
          # De donde sales. Va dentro de `viaje` por lo mismo que las fechas:
          # `client_payload` solo admite diez propiedades de primer nivel.
          if [ -n "$ORIGIN" ];    then args+=(--origin "$ORIGIN"); fi
          # weekend: "no" busca cualquier dia de la semana
          if [ "$WEEKEND" = "no" ]; then args+=(--any-day); fi
          # Quien la pide entra en el nombre del fichero, asi que la misma
          # busqueda hecha por dos personas no se sobrescribe.
          if [ -n "$OWNER" ];      then args+=(--owner "$OWNER"); fi
          if [ -n "$OWNER_NAME" ]; then args+=(--owner-name "$OWNER_NAME"); fi
          python -m tripfinder search \
            --dest "$DEST" --label "$LABEL" "${args[@]}"

      # ORGANIZAR EL FINDE: y ademas donde dormir.
      #
      # Va en ESTE job y no en un dispatch aparte por un motivo concreto: el
      # `GITHUB_TOKEN` de un workflow no puede disparar otro workflow —GitHub lo
      # impide para que nada se llame a si mismo en bucle—, asi que un
      # `repository_dispatch` de tipo `stay` desde aqui no arrancaria nada y
      # nadie se enteraria. Llamando al comando directamente, el mismo run deja
      # el vuelo y la cama, y el commit de abajo se lleva las dos cosas.
      #
      # El alojamiento se pide para el MEJOR vuelo que haya salido: es el que la
      # web ensena primero y el unico para el que las fechas estan decididas.
      - name: Y donde dormir
        if: steps.parse.outputs.camas == 'si'
        env:
          PYTHONPATH: src
          AMADEUS_CLIENT_ID: ${{ secrets.AMADEUS_CLIENT_ID }}
          AMADEUS_CLIENT_SECRET: ${{ secrets.AMADEUS_CLIENT_SECRET }}
          ADULTS: ${{ steps.parse.outputs.adults }}
        run: |
          # El fichero que acaba de escribir la busqueda.
          fichero=$(git status --porcelain data/searches \
            | awk '{print $2}' | grep -v index.json | head -1)
          if [ -z "$fichero" ]; then
            echo "Sin resultados: no hay viaje al que buscarle cama."
            exit 0
          fi

          # El mejor viaje, que es el primero: se guardan ya ordenados por lo
          # que la web ensena arriba. Sin heredoc a proposito: dentro de un
          # `run:` indentado, bash no reconoce un terminador que no este en la
          # columna cero y el paso se cuelga leyendo para siempre.
          datos=$(python -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); o=(d.get("offers") or [None])[0]; print("\t".join(str(o.get(k) or "") for k in ("id","destination_name","destination_country","destination","depart_date","return_date")) if o else "")' "$fichero")
          if [ -z "$datos" ]; then
            echo "La busqueda no encontro ningun viaje."
            exit 0
          fi
          IFS=$'\t' read -r OFFER CIUDAD PAIS IATA IDA VUELTA <<< "$datos"
          echo "Buscando cama en $CIUDAD del $IDA al $VUELTA"
          # Si el alojamiento falla, la busqueda de vuelo ya esta hecha y se
          # publica igual: media respuesta es mejor que ninguna.
          python -m tripfinder scan-stays \
            --offer-id "$OFFER" --city "$CIUDAD" --country "$PAIS" --iata "$IATA" \
            --checkin "$IDA" --checkout "$VUELTA" \
            ${ADULTS:+--adults "$ADULTS"} \
            || echo "El alojamiento no salio; el vuelo si esta guardado."

      - name: Publicar resultados
        run: |
          git config user.name  "tripfinder-bot"
          git config user.email "actions@github.com"

          # Solo el fichero que ha generado ESTA busqueda. Antes se guardaba
          # una copia de la carpeta entera y al reaplicarla resucitaba lo que
          # otro run habia borrado y pisaba lo que otro habia escrito: de ahi
          # que las busquedas aparecieran y desaparecieran solas.
          nuevos=$(git status --porcelain data/searches | awk '{print $2}' | grep -v index.json || true)
          if [ -z "$nuevos" ]; then
            echo "La busqueda no genero fichero"
            exit 0
          fi
          mkdir -p /tmp/tf/searches /tmp/tf/stays
          for f in $nuevos; do cp "$f" /tmp/tf/searches/; done

          # Y el alojamiento, si el paso anterior lo ha buscado. ESTO ES
          # NECESARIO: abajo hay un `git reset --hard` que se lo llevaria por
          # delante, y el viaje se publicaria sin la cama que se acaba de
          # scrapear. `index.json` y `camas.json` no se copian porque son
          # derivados: los rehace `reindex`.
          camas=$(git status --porcelain data/stays | awk '{print $2}' | grep -v index.json || true)
          for f in $camas; do cp "$f" /tmp/tf/stays/; done

          for intento in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data/searches data/stays
            for f in /tmp/tf/searches/*.json; do cp "$f" data/searches/; done
            for f in /tmp/tf/stays/*.json; do [ -e "$f" ] && cp "$f" data/stays/; done
            PYTHONPATH=src python -m tripfinder reindex
            git add data/searches data/stays data/camas.json
            if git diff --staged --quiet; then
              echo "Sin cambios"
              exit 0
            fi
            git commit -m "data: busqueda ${{ steps.parse.outputs.dest }}"
            if git push; then
              echo "Publicado al intento $intento"
              exit 0
            fi
            echo "Otra publicacion se adelanto; se reintenta"
            sleep $((RANDOM % 6 + 2))
          done
          exit 1

      - name: Redesplegar la web
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
