name: CI

# Todo lo que tiene que estar bien antes de mezclar, en un solo sitio: el
# backend (ruff + pytest), el montaje de las partes de la web y el humo de
# frontend. Si esto esta en verde, la portada pinta y los scrapers parsean.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Un PR al que le llegan tres pushes seguidos no necesita tres CI: vale el
# ultimo. En main no se cancela, que ahi el historico importa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: ruff + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # la misma que el resto de workflows
          cache: pip

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: ruff
        run: ruff check .

      - name: pytest
        run: python -m pytest -q

      # La cabecera, el nav y el pie viven una vez en web/partes/. Si alguien
      # edito una region a mano, mejor saberlo aqui que publicar cuatro
      # cabeceras distintas.
      - name: Las partes de la web estan montadas
        run: python tools/montar.py --check

      # El texto mas pequeño de la web va a 9.5px: 4.5:1 no es un adorno. Lee
      # los tokens del CSS, asi que salta si alguien aclara un color de mas.
      - name: Contraste de la paleta
        run: python tools/contraste.py --check

      # Los iconos de la aplicacion instalable salen de la paleta del CSS, no
      # de un editor. Si alguien cambia un color y no los regenera, aqui salta.
      - name: Los iconos cuadran con la paleta
        run: python tools/iconos.py --check


  web:
    name: humo de frontend
    # Fijo y no «latest»: Playwright 1.56 no trae Chromium para Ubuntu 26.04,
    # y al cambiar GitHub la imagen por defecto el humo dejó de arrancar.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Linter de JS
        run: npm run lint

      # Solo Chromium: esto es humo, no una matriz de navegadores.
      - name: Instalar Chromium
        # El espejo de Ubuntu de Azure a veces no resuelve y las dependencias del
        # navegador (fuentes) no bajan: se usa el espejo principal y se reintenta.
        run: |
          sudo sed -i 's#azure\.archive\.ubuntu\.com#archive.ubuntu.com#g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          for i in 1 2 3; do npx playwright install --with-deps chromium && exit 0; sleep $((i * 15)); sudo apt-get update || true; done
          exit 1

      - name: Humo
        run: npm run humo

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Las reglas de Firestore son lo unico que separa los datos de cada cuenta, asi
  # que se prueban contra el emulador de verdad: lo que NO dejan hacer, la cola
  # de encargos de Python y la web entera registrando, aprobando y lanzando.
  firebase:
    name: reglas y cuentas (emulador de Firebase)
    # Fijo y no «latest»: Playwright 1.56 no trae Chromium para Ubuntu 26.04,
    # y al cambiar GitHub la imagen por defecto el humo dejó de arrancar.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/firebase/package-lock.json

      # El emulador de Firestore es un jar y firebase-tools 15 pide Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Solo lo que usa la cola de encargos: scrapling y compania no hacen falta.
      - run: pip install requests PyYAML python-dotenv "google-cloud-firestore>=2.19" pytest

      - run: npm ci
      - run: npm ci --prefix tests/firebase
      - name: Instalar Chromium
        # El espejo de Ubuntu de Azure a veces no resuelve y las dependencias del
        # navegador (fuentes) no bajan: se usa el espejo principal y se reintenta.
        run: |
          sudo sed -i 's#azure\.archive\.ubuntu\.com#archive.ubuntu.com#g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          for i in 1 2 3; do npx playwright install --with-deps chromium && exit 0; sleep $((i * 15)); sudo apt-get update || true; done
          exit 1

      - name: Reglas, encargos y cuentas
        run: npm run todo --prefix tests/firebase

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-firebase
          path: |
            playwright-report/
            test-results/
          retention-days: 7
