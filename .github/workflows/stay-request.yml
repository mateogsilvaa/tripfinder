name: Buscar alojamiento (bajo demanda)

# Lo levanta la web con un `repository_dispatch: stay` —a traves de un encargo
# en Firestore, que recoge `encargos.yml`—. Ya no se atiende ninguna issue: el
# repositorio es publico, una issue la lee cualquiera, y abrir una era ademas
# la forma de que un tercero gastase minutos de Actions.

on:
  repository_dispatch:
    types: [stay]

permissions:
  contents: write
  actions: write # para lanzar el deploy de Pages

concurrency:
  group: tripfinder-data
  cancel-in-progress: false

jobs:
  stays:
    # Buscar cama son un par de minutos; de ahi en adelante es que se ha
    # colgado, y sin esto se queda hasta el limite de 6 horas de GitHub.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Extraer los datos de la peticion
        id: parse
        env:
          P_OFFER: ${{ github.event.client_payload.offer_id }}
          P_CITY: ${{ github.event.client_payload.city }}
          P_COUNTRY: ${{ github.event.client_payload.country }}
          P_IATA: ${{ github.event.client_payload.iata }}
          P_CHECKIN: ${{ github.event.client_payload.checkin }}
          P_CHECKOUT: ${{ github.event.client_payload.checkout }}
          P_ADULTS: ${{ github.event.client_payload.adults }}
        run: |
          {
            echo "offer_id=$P_OFFER"; echo "city=$P_CITY"; echo "country=$P_COUNTRY"
            echo "iata=$P_IATA"; echo "checkin=$P_CHECKIN"; echo "checkout=$P_CHECKOUT"
            echo "adults=$P_ADULTS"
          } >> "$GITHUB_OUTPUT"

      - name: Buscar alojamiento
        env:
          PYTHONPATH: src
          AMADEUS_CLIENT_ID: ${{ secrets.AMADEUS_CLIENT_ID }}
          AMADEUS_CLIENT_SECRET: ${{ secrets.AMADEUS_CLIENT_SECRET }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          OFFER_ID: ${{ steps.parse.outputs.offer_id }}
          CITY: ${{ steps.parse.outputs.city }}
          COUNTRY: ${{ steps.parse.outputs.country }}
          IATA: ${{ steps.parse.outputs.iata }}
          CHECKIN: ${{ steps.parse.outputs.checkin }}
          CHECKOUT: ${{ steps.parse.outputs.checkout }}
          ADULTS: ${{ steps.parse.outputs.adults }}
        run: |
          # Los flags opcionales se anaden solo si el encargo los traia.
          args=()
          if [ -n "$CITY" ];     then args+=(--city "$CITY"); fi
          if [ -n "$COUNTRY" ];  then args+=(--country "$COUNTRY"); fi
          if [ -n "$IATA" ];     then args+=(--iata "$IATA"); fi
          if [ -n "$CHECKIN" ];  then args+=(--checkin "$CHECKIN"); fi
          if [ -n "$CHECKOUT" ]; then args+=(--checkout "$CHECKOUT"); fi
          if [ -n "$ADULTS" ];   then args+=(--adults "$ADULTS"); fi
          python -m tripfinder scan-stays \
            --offer-id "$OFFER_ID" \
            "${args[@]}"

      - name: Publicar resultados
        run: |
          git config user.name  "tripfinder-bot"
          git config user.email "actions@github.com"
          git add data
          if git diff --staged --quiet; then
            echo "Sin cambios"
          else
            git commit -m "data: alojamiento para ${{ steps.parse.outputs.offer_id }}"
            git pull --rebase --autostash
            git push
          fi

      - name: Redesplegar la web
        # Un push hecho con GITHUB_TOKEN no dispara otros workflows (regla
        # anti-bucle de GitHub), asi que Pages hay que lanzarlo explicitamente
        # o los datos nuevos nunca llegan a la web.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
