name: Seguir un viaje

# La web manda un repository_dispatch con lo que quieres vigilar (o quitar) y
# esto lo apunta en data/watch.json. A partir de ahi lo revisa el cron cada dia.

on:
  repository_dispatch:
    types: [watch, unwatch, delete_search]

permissions:
  contents: write
  actions: write

concurrency:
  # Un grupo por accion: con uno comun, GitHub cancelaba la que estuviera en
  # cola y el seguimiento o el borrado desaparecian sin avisar.
  group: watch-${{ github.event.action }}-${{ github.event.client_payload.id || github.run_id }}
  cancel-in-progress: false

jobs:
  seguir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Aplicar el cambio sobre lo ultimo publicado
        env:
          PYTHONPATH: src
          TIPO: ${{ github.event.client_payload.tipo }}
          ID: ${{ github.event.client_payload.id }}
          DEST: ${{ github.event.client_payload.dest }}
          LABEL: ${{ github.event.client_payload.label }}
          DEPART: ${{ github.event.client_payload.depart }}
          RETURN_DATE: ${{ github.event.client_payload.return_date }}
          MAXP: ${{ github.event.client_payload.max_price }}
          MONTHS: ${{ github.event.client_payload.months }}
          ADULTS: ${{ github.event.client_payload.adults }}
          WEEKEND: ${{ github.event.client_payload.weekend }}
        run: |
          git config user.name  "tripfinder-bot"
          git config user.email "actions@github.com"

          aplicar() {
            if [ "$TIPO" = "unwatch" ]; then
              python -m tripfinder watch remove --id "$ID"
            elif [ "$TIPO" = "delete_search" ]; then
              python -m tripfinder watch remove-search --id "$ID"
            else
              args=()
              if [ -n "$DEST" ];        then args+=(--dest "$DEST"); fi
              if [ -n "$LABEL" ];       then args+=(--label "$LABEL"); fi
              if [ -n "$DEPART" ];      then args+=(--depart "$DEPART"); fi
              if [ -n "$RETURN_DATE" ]; then args+=(--return "$RETURN_DATE"); fi
              if [ -n "$MAXP" ];        then args+=(--max-price "$MAXP"); fi
              if [ -n "$MONTHS" ];      then args+=(--months "$MONTHS"); fi
              if [ -n "$ADULTS" ];      then args+=(--adults "$ADULTS"); fi
              if [ "$WEEKEND" = "no" ]; then args+=(--any-day); fi
              python -m tripfinder watch add "${args[@]}"
            fi
          }

          # Si añades tres seguimientos seguidos, los tres workflows arrancan a
          # la vez desde el mismo fichero y al hacer push se pisan: sobrevivia
          # solo el ultimo. Por eso cada intento se resincroniza con lo que ya
          # esta publicado y vuelve a aplicar el cambio encima.
          for intento in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            aplicar
            git add data
            if git diff --staged --quiet; then
              echo "Sin cambios que guardar"
              exit 0
            fi
            git commit -m "data: seguimientos"
            if git push; then
              echo "Guardado al intento $intento"
              exit 0
            fi
            echo "Otro cambio llego antes; se reintenta"
            sleep $((RANDOM % 6 + 2))
          done
          echo "No se pudo guardar tras varios intentos"
          exit 1

      - name: Redesplegar la web
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
