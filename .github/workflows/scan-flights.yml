name: Buscar chollos de vuelo

on:
  schedule:
    - cron: "0 6,18 * * *" # 08:00 y 20:00 hora peninsular
  workflow_dispatch:
    inputs:
      no_email:
        description: "Ejecutar sin enviar email"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tripfinder-data
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Buscar vuelos y notificar
        env:
          PYTHONPATH: src
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO || secrets.SMTP_USER }}
          AMADEUS_CLIENT_ID: ${{ secrets.AMADEUS_CLIENT_ID }}
          AMADEUS_CLIENT_SECRET: ${{ secrets.AMADEUS_CLIENT_SECRET }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          python -m tripfinder scan-flights ${{ inputs.no_email && '--no-email' || '' }}

      - name: Publicar resultados
        run: |
          git config user.name  "tripfinder-bot"
          git config user.email "actions@github.com"
          git add data
          git diff --staged --quiet && echo "Sin cambios" && exit 0
          git commit -m "data: scan de vuelos $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase --autostash
          git push
