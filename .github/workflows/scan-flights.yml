name: Buscar chollos de vuelo

on:
  schedule:
    # Los cron de GitHub van en UTC y no saben de horarios de verano: esto es
    # las 08:00 y 20:00 en verano (CEST) y las 07:00 y 19:00 en invierno (CET).
    # Para un barrido cada doce horas, una hora arriba o abajo da igual, asi que
    # se deja un solo cron y se dice la verdad en el comentario. La regla, en
    # docs/ARCHITECTURE.md.
    - cron: "0 6,18 * * *"
  workflow_dispatch:
    inputs:
      no_email:
        description: "Ejecutar sin enviar email"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write # para lanzar el deploy de Pages

concurrency:
  group: tripfinder-data
  cancel-in-progress: false

jobs:
  scan:
    # El barrido de Madrid son ~37 minutos, y las escalas y las otras ciudades
    # de salida tienen su propio tope (12 + 15). Si pasa de hora y media es que
    # un proveedor esta colgado, y sin esto arrastra hasta las 6 horas de GitHub.
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Comprobar secretos (sin revelarlos)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AMADEUS_CLIENT_ID: ${{ secrets.AMADEUS_CLIENT_ID }}
        run: |
          echo "RESEND_API_KEY: ${#RESEND_API_KEY} caracteres"
          echo "AMADEUS_CLIENT_ID: ${#AMADEUS_CLIENT_ID} caracteres"

      - name: Buscar vuelos y notificar
        env:
          PYTHONPATH: src
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          GITHUB_TOKEN: ${{ github.token }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # Las notificaciones del movil (`notify/push.py`). Sin el, solo correo.
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO || secrets.SMTP_USER }}
          AMADEUS_CLIENT_ID: ${{ secrets.AMADEUS_CLIENT_ID }}
          AMADEUS_CLIENT_SECRET: ${{ secrets.AMADEUS_CLIENT_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          REPO_SLUG: ${{ github.repository }}
          # A quien se le avisa sale de Firestore (cuentas aprobadas y cuentas de
          # antes aun sin vincular). Sin el secreto, el aviso al buzon de siempre.
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python -m tripfinder scan-flights ${{ inputs.no_email && '--no-email' || '' }}

      - name: Revisar seguimientos
        # Nunca puede tumbar el scan: los vuelos ya estan buscados y tienen que
        # publicarse aunque el parte de seguimientos falle.
        continue-on-error: true
        # Los encargos del usuario: destinos o fechas concretas que vigila a
        # diario y por los que avisa solo cuando aparece algo que cumple.
        env:
          PYTHONPATH: src
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          GITHUB_TOKEN: ${{ github.token }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # Las notificaciones del movil (`notify/push.py`). Sin el, solo correo.
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO || secrets.SMTP_USER }}
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          REPO_SLUG: ${{ github.repository }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python -m tripfinder watch run

      - name: Escalas propias (dos low cost por un puente)
        # Los destinos sin directo desde Madrid. Va despues del barrido para
        # saber cuales SI tienen directo, y nunca lo tumba: si falla, el
        # tablon de siempre ya esta escrito.
        continue-on-error: true
        timeout-minutes: 12
        env:
          PYTHONPATH: src
        run: python -m tripfinder scan-escalas

      - name: Otras ciudades de salida
        # Barcelona, Valencia, Malaga... unas pocas por pasada, las mas viejas
        # primero, para que ninguna alargue el barrido.
        continue-on-error: true
        timeout-minutes: 15
        env:
          PYTHONPATH: src
        run: python -m tripfinder scan-origenes

      - name: Publicar resultados
        run: |
          git config user.name  "tripfinder-bot"
          git config user.email "actions@github.com"
          git add data
          git diff --staged --quiet && echo "Sin cambios" && exit 0
          git commit -m "data: scan de vuelos $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase --autostash
          git push

      - name: Redesplegar la web
        # Un push hecho con GITHUB_TOKEN no dispara otros workflows (regla
        # anti-bucle de GitHub), asi que Pages hay que lanzarlo explicitamente
        # o los datos nuevos nunca llegan a la web.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
