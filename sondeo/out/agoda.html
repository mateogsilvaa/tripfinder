    const src = err.path[0].src;
    const href = err.path[0].href;
    var message = ["could not load", src ? src : href].join(" ");
    try {
        const log = messagingClient.create('log', { logLevel: 'error', message: message, applicationName: 'cronos', loggerName: 'Fe.Cronos.Logger' });
        messagingClient.send(log);
    }
    catch (exception) {
    }
}

e otorgan una sola vez por estancia. Si no utiliza el Crédito de $100.00 para Experiencias u otros beneficios durante la estancia elegible, no se le otorgará ningún reembolso o compensación y se perderá el saldo restante.\n  \u003c/p\u003e\n\n  \u003ch2\u003eCambios a Una Categoría Más Alta de Habitación (Tarifas de \u003ci\u003eThe Reserve\u003c/i\u003e únicamente)\u003c/h2\u003e\n  \u003cp\u003e\n    Los Cambios a Una Categoría Más Alta de Habitación se basan en la disponibilidad y solo algunos tipos de habitación están disponibles para ello.\n  \u003c/p\u003e\n\n  \u003ch2\u003eDesayuno Diario para Dos Personas (Tarifas de \u003ci\u003eThe Reserve\u003c/i\u003e)\u003c/h2\u003e\n  \u003cp\u003e\n    El Desayuno Diario para Dos Personas está incluido y el hotel puede proporcionarlo directamente o en forma de tarjeta de regalo o de crédito. Si el desayuno está incluido como servicio estándar del hotel, no se otorgará ninguna compensación o beneficio adicional.\n  \u003c/p\u003e\n\n  \u003ch2\u003eWifi sin cargo (tarifas de \u003ci\u003eThe Reserve\u003c/i\u003e y Hotel Collection)\u003c/h2\u003e\n  \u003cp\u003e\n    El Wifi se proporciona sin cargo, salvo en determinados hoteles donde no está disponible o se incluye como parte de la tarifa diaria obligatoria de resort. Si el Wifi está incluido como servicio estándar del hotel, no se otorgará ninguna compensación o beneficio adicional.\n  \u003c/p\u003e\n\n  \u003ch2\u003eCheck-In y Check-Out (tarifas de \u003ci\u003eThe Reserve\u003c/i\u003e y Hotel Collection)\u003c/h2\u003e\n  \u003cp\u003e\n    La elegibilidad para hacer un Check-In más temprano se determina al momento de hacer el check-in y está sujeta a disponibilidad.\n  \u003c/p\u003e\n  \u003cp\u003e\n    La elegibilidad para hacer un Check-Out más tarde se determina al momento de hacer el check-in y está sujeta a disponibilidad.\n  \u003c/p\u003e\n\n  \u003ch2\u003eGeneralidades\u003c/h2\u003e\n  \u003cp\u003e\n    Tanto los Beneficios de The Reserve como los de Hotel Collection están sujetos a disponibilidad y cambios, pueden variar según el hotel y no se pueden canjear por efectivo ni combinar con ninguna otra oferta. Los beneficios deben utilizarse durante la estadía reservada y no pueden utilizarse en una fecha posterior. Los beneficios están disponibles solo cuando la reserva se hace a través del portal de Citi Travel® utilizando una tarjeta Citi elegible. Todas las reservas de Hotel Collection y The Reserve también están sujetas a los Términos y Condiciones de Uso de Rocket Travel de Agoda para Hoteles, Automóviles y Atracciones, que se indican arriba.\n  \u003c/p\u003e","CollectionBannerTncBodyHotelCollection":" \u003ch2\u003eDesayuno Diario para Dos Personas (Tarifas de Hotel Collection)\u003c/h2\u003e\n  \u003cp\u003e\n    El Desayuno Diario para Dos Personas está incluido y el hotel puede proporcionarlo directamente o en forma de tarjeta de regalo o de crédito. Si el desayuno está incluido como servicio estándar del hotel, no se otorgará ninguna compensación o beneficio adicional.\n  \u003c/p\u003e\n\n  \u003ch2\u003eWifi sin cargo (tarifas de Hotel Collection)\u003c/h2\u003e\n  \u003cp\u003e\n    El Wifi se proporciona sin cargo, salvo en determinados hoteles donde no está disponible o se incluye como parte de la tarifa diaria obligatoria de resort. Si el Wifi está incluido como servicio estándar del hotel, no se otorgará ninguna compensación o beneficio adicional.\n  \u003c/p\u003e\n\n  \u003ch2\u003eCheck-In y Check-Out (tarifas de Hotel Collection)\u003c/h2\u003e\n  \u003cp\u003e\n    La elegibilidad para hacer un Check-In más temprano se determina al momento de hacer el check-in y está sujeta a disponibilidad.\n  \u003c/p\u003e\n  \u003cp\u003e\n    La elegibilidad para hacer un Check-Out más tarde se determina al momento de hacer el check-in y está sujeta a disponibilidad.\n  \u003c/p\u003e\n\n  \u003ch2\u003eGeneralidades\u003c/h2\u003e\n  \u003cp\u003e\n    Los Beneficios de Hotel Collection están s  /\u003e\u003cbr /\u003e \u003col class=\u0022dash-list\u0022\u003e \u003cli\u003eTarifas Corporativas\u003c/li\u003e \u003cli\u003eTarifas dirigidas a grupos u ofrecidas para convenciones o reuniones \u003c/li\u003e \n  \u003cli\u003eCualquier tipo de tarifa que requiera ser miembro de un club (por ejemplo: las tarifas AAA o AARP)\u003c/li\u003e \n  \u003cli\u003eProgramas de fidelidad\u003c/li\u003e \u003cli\u003eCualquier organización cuyas tarifas están destinadas a grupos específicos o individuos y no al público en general\u003c/li\u003e \u003c/ol\u003e \u003c/li\u003e \u003c/ul\u003e \n\u003cp\u003e\u003cstrong\u003e4.\u003c/strong\u003e Agoda tiene el derecho y el criterio para determinar la validez de la reclamación, lo que incluye, pero no se limita a,  determinar que la solicitud se refiere al mismo hotel, tipo de habitación, que corresponde a las mismas fechas, y cumple con todos los términos, condiciones y requisitos del Proceso de Solicitud.  \u003c/p\u003e \n\u003cp\u003e\u003cstrong\u003e5.\u003c/strong\u003e  La \u0022Garantía de Precio Agoda\u0022 no puede combinarse con otras ofertas o promociones.\u003c/p\u003e \u003cp\u003e\u003cstrong\u003e6.\u003c/strong\u003e Agoda se reserva el derecho de modificar, revisar, completar, suspender o discontinuar su política del \u0022Precio más bajo garantizado\u0022 en cualquier momento.\u003c/p\u003e \u003cp\u003eCualquier pregunta relacionada con reclamaciones debe ser dirigida a nuestro Servicio de Atención al Cliente.\u003c/p\u003e \u003c/div\u003e \u003c!-- wrapper ends --\u003e"},"isDebug":false,"functions":{"AlternativePropertiesFunction":"{ \r\n            init: function(){ agoda.ssr.alternativeHotel.init(params.alternativeHotel); }\r\n        }"},"loginBanner":{"DiscountUptoText":"Ofertas Privadas de Agoda: hasta \u003cspan\u003e30%\u003c/span\u003e de descuento en todo el mundo","SignInNowText":"Entra ahora","SignInToUnlockText":"¡Los precios bajan cuando inicias sesión!","ShowFavoriteSignIn":"functi e deba reservar por anticipado algunos de los servicios que puede utilizar con los $100.00 dólares estadounidenses de Crédito para Experiencias. Comuníquese directamente con el hotel para obtener más información y hacer las reservas que sean necesarias.\n  \u003c/p\u003e\n  \u003cp\u003e\n    Las estadías consecutivas dentro de 24 horas en el mismo hotel se consideran una sola estadía. Los beneficios se otorgan una sola vez por estancia. Si no utiliza el Crédito de $100.00 para Experiencias u otros beneficios durante la estancia elegible, no se le otorgará ningún reembolso o compensación y se perderá el saldo restante.\n  \u003c/p\u003e\n\n  \u003ch2\u003eCambios a Una Categoría Más Alta de Habitación (Tarifas de \u003ci\u003eThe Reserve\u003c/i\u003e únicamente)\u003c/h2\u003e\n  \u003cp\u003e\n    Los Cambios a Una Categoría Más Alta de Habitación se basan en la disponibilidad y solo algunos tipos de habitación están disponibles para ello.\n  \u003c/p\u003e\n\n  \u003ch2\u003eDesayuno Diario para Dos Personas (Tarifas de \u003ci\u003eThe Reserve\u003c/i\u003e)\u003c/h2\u003e\n  \u003cp\u003e\n    El Desayuno Diario para Dos Personas está incluido y el hotel puede proporcionarlo directamente o en forma de tarjeta de regalo o de crédito. Si el desayuno está incluido como servicio estándar del hotel, no se otorgará ninguna compensación o beneficio adicional.\n  \u003c/p\u003e\n\n  \u003ch2\u003eWifi sin cargo (tarifas de \u003ci\u003eThe Reserve\u003c/i\u003e y Hotel Collection)\u003c/h2\u003e\n  \u003cp\u003e\n    El Wifi se proporciona sin cargo, salvo en determinados hoteles donde no está disponible o se incluye como parte de la tarifa diaria obligatoria de resort. Si el Wifi está incluido como servicio estándar del hotel, no se otorgará ninguna compensación o beneficio adicional.\n  \u003c/p\u003e\n\n  \u003ch2\u003eCheck-In y Check-Out (tarifas de \u003ci\u003eThe Reserve\u003c/i\u003e y Hotel Collection)\u003c/h2\u003e\n  \u003cp\u003e\n    La elegibilidad para hacer un Check-In más temprano se determina al momento de hacer el check-in y está sujeta a disponibilidad.\n  \u003c/p\u003e\n  \u003cp\u003e\n    La elegibilidad para hacer un Check-Out más tarde se determina al momento de hacer el check-in y está sujeta a disponibilidad.\n  \u003c/p\u003e\n\n  \u003ch2\u003eGeneralidades\u003c/h2\u003e\n  \u003cp\u003e\n    Tanto los Beneficios de The Reserve como los de Hotel Collection están sujetos a disponibilidad y cambios, pueden variar según el hotel y no se pueden canjear por efectivo ni combinar con ninguna otra oferta. Los beneficios deben utilizarse durante la estadía reservada y no pueden utilizarse en una fecha posterior. Los beneficios están disponibles solo cuando la reserva se hace a través del portal de Citi Travel® utilizando una tarjeta Citi elegible. Todas las reservas de Hotel Collection y The Reserve también están sujetas a los Términos y Condiciones de Uso de Rocket Travel de Agoda para Hoteles, Automóviles y Atracciones, que se indican arriba.\n  \u003c/p\u003e","tncBodyHotelCollection":" \u003ch2\u003eDesayuno Diario para Dos Personas (Tarifas de Hotel Collection)\u003c/h2\u003e\n  \u003cp\u003e\n    El Desayuno Diario para Dos Personas está incluido y el hotel puede proporcionarlo directamente o en forma de tarjeta de regalo o de crédito. Si el desayuno está incluido como servicio estándar del hotel, no se otorgará ninguna compensación o beneficio adicional.\n  \u003c/p\u003e\n\n  \u003ch2\u003eWifi sin cargo (tarifas de Hotel Collection)\u003c/h2\u003e\n  \u003cp\u003e\n    El Wifi se proporciona sin cargo, salvo en determinados hoteles donde no está disponible o se incluye como parte de la tarifa diaria obligatoria de resort. Si el Wifi está incluido como servicio estándar del hotel, no se otorgará ninguna compensación o beneficio adicional.\n  \u003c/p\u003e\n\n  \u003ch2\u003eCheck-In y Check-Out (tarifas de Hotel Collection)\u003c/h2\u003e\n  \u003cp\u003e\n    La elegibilidad para hacer un Check-In más temprano se determina al momento de hacer el check-in y está sujeta a disponibilidad.\n  \u003c/p\u003e\n  \u003cp\u003e\n    La elegibilidad para hacer un Check-Out más tarde se determina al momento de hacer el check-in y está sujeta a disponibilidad.\n  \u003c/p\u003e\n\n  \u003ch2\u003eGeneralidades\u003c/h2\u003e\n  \u003cp\u003e\n    Los Beneficios de Hotel Collection están sujetos a disponibilidad y cambios, pueden variar según el hotel y no se pueden canjear por efectivo ni combinar con ninguna otra oferta. Los beneficios deben utilizarse durante la estadía reservada y no pueden utilizarse en una fecha posterior. Los beneficios están disponibles solo cuando la reserva se hace a través del portal de Citi Travel® utilizando una tarjeta Citi elegible. Todas las reservas de Hotel Collection y \u003ci\u003eThe Reserve\u003c/i\u003e también están sujetas a los Términos y Condiciones de Uso de Rocket Travel de Agoda para Hoteles, Automóviles y Atracciones, que se indican arriba.\n  \u003c/p\u003e","tncTitleReserve":"The Reserve, de Citi Travel, Beneficios, y Términos y Condiciones Complementarios","tncTitleHotelCollection":"Beneficios, y Términos y Condiciones Complementarios de The Hotel Collection","tncClose":"Cerrar","tncBenefitsTitleReserve":"Beneficios de The Reserve (tarjetahabientes de Citi Strata Elite®, Citi Strata Premier® y Citi Prestige®):","tncBenefitsTitleHotelCollection":"Beneficios de Hotel Collection (Todos los tarjetahabientes elegibles con acceso a Citi Travel®):","tncBenefitsHtmlReserve":"\u003cul\u003e\n    \u003cli\u003e*$100.00 (dólares estadounidenses) de Crédito para Experiencias\u003c/li\u003e\n    \u003cli\u003eCambio a Una Categoría Más Alta de Habitación, sujeto a disponibilidad\u003c/li\u003e\n    \u003cli\u003eDesayuno Diario para Dos Personas\u003c/li\u003e\n    \u003cli\u003eWifi sin cargo\u003c/li\u003e\n    \u003cli\u003eCheck-In más temprano, sujeto a disponibilidad\u003c/li\u003e\n    \u003cli\u003eCheck-Out más tarde, suje
